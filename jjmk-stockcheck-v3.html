      <div id="sfCycWrap"><label class="fld">รอบสั่ง (วัน)</label><input id="sfCyc" type="number" min="1" class="inp" value="${s.cycleDays||''}"></div>
      <div id="sfMdWrap"><label class="fld">สั่งทุกวันที่ (คั่นด้วย ,)</label><input id="sfMd" class="inp" value="${(s.monthDays||[]).join(', ')}" placeholder="เช่น 1, 16"></div>
      <div id="sfLeadWrap"><label class="fld">ของเข้า +กี่วัน (เมื่อไม่ได้ระบุวันส่ง)</label><input id="sfLead" type="number" min="0" class="inp" value="${s.leadDays??1}"></div>
    </div>
    <label class="fld" style="margin-bottom:6px">ตารางสั่ง → วันของเข้า (เว้น "—" = วันนั้นสั่งไม่ได้)</label>
    <div style="background:#FBF6EC; border:1px solid var(--line); border-radius:10px; padding:12px; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px">
      ${WD_ORDER.map(wd=>`<div><label class="fld">สั่งวัน${THD[wd]}</label>
        <select class="inp sf-dm" data-wd="${wd}">
          <option value="">— สั่งไม่ได้</option>
          ${[1,2,3,4,5,6,0].map(d=>`<option value="${d}" ${dm[wd]===d?'selected':''}>→ ส่ง${THD[d]}</option>`).join('')}
        </select></div>`).join('')}
    </div>
    <div class="t-sub" id="sfHint" style="margin-top:8px"></div>
  </div>
  <div class="modal-f">
    ${sid?`<button class="btn btn-ghost" style="margin-right:auto; color:var(--bad)" onclick="deleteSup('${sid}')">ลบ</button>`:''}
    <button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>
    <button class="btn btn-red" onclick="saveSup(${sid?`'${sid}'`:'null'})">✓ บันทึก</button></div>`);
  supModeHint();
}
function supModeHint(){
  const m = $('#sfMode').value;
  $('#sfCycWrap').style.display = m==='cycle' ? '' : 'none';
  $('#sfMdWrap').style.display = m==='monthly' ? '' : 'none';
  $('#sfHint').textContent = m==='daymap' ? 'สั่งได้เฉพาะวันที่ระบุวันส่งไว้ · ระบบจะบอกวันสั่งถัดไปให้อัตโนมัติ'
    : m==='cycle' ? 'ระบบจะเตือนเมื่อครบรอบสั่ง (นับจากใบสั่งล่าสุดของสาขา) · วันส่งใช้ตารางด้านบน'
    : m==='monthly' ? 'สั่งได้เฉพาะวันที่ที่ระบุ เช่น "1, 16" = ต้นเดือนกับกลางเดือน · วันส่งใช้ตารางด้านบน ถ้าไม่ระบุใช้ "ของเข้า +กี่วัน"'
    : 'สั่งได้ทุกวัน · ถ้าวันไหนไม่ระบุวันส่ง จะใช้ "ของเข้า +กี่วัน" แทน';
}
function saveSup(sid){
  const name = $('#sfName').value.trim();
  if(!name) return toast('กรุณาใส่ชื่อซัพพลายเออร์');
  const dayMap = [null,null,null,null,null,null,null];
  $$('.sf-dm').forEach(sel=>{ dayMap[Number(sel.dataset.wd)] = sel.value==='' ? null : Number(sel.value); });
  const monthDays = $('#sfMd').value.split(',').map(x=>parseInt(x.trim(),10)).filter(x=>x>=1 && x<=31);
  const lgName = $('#sfLine').value.trim();
  const lgId = ((S.lineGroups||[]).find(g=>g.name===lgName)||{}).id || null;
  const data = {name, lineGroup:lgName, lineGroupId:lgId, mode:$('#sfMode').value,
    cutoff:$('#sfCut').value||null, minOrder:Number($('#sfMin').value)||null,
    cycleDays:Number($('#sfCyc').value)||null, monthDays:monthDays.length?[...new Set(monthDays)].sort((a,b)=>a-b):null,
    leadDays:Number($('#sfLead').value)||1, dayMap};
  if(sid){ Object.assign(supById(sid), data); } else { S.suppliers.push({id:uid('s_'), ...data}); }
  DB.save(); closeModal(); renderSuppliers(); toast('บันทึกซัพพลายเออร์แล้ว');
}
function deleteSup(sid){
  let n = 0;
  S.branches.forEach(b=>{ n += S.bd[b.id].products.filter(p=>p.supId===sid).length; });
  if(n) return toast(`ลบไม่ได้ ยังมีสินค้าผูกอยู่ ${n} รายการ (รวมทุกสาขา) — ย้ายหรือลบสินค้าก่อน`);
  confirmBox('ลบซัพพลายเออร์นี้?', ()=>{ S.suppliers = S.suppliers.filter(s=>s.id!==sid); DB.save(); closeModal(); renderSuppliers(); toast('ลบแล้ว'); });
}

/* =====================  ตั้งค่า  ===================== */
function renderSettings(){
  $('#page-settings').innerHTML = `
  <div class="grid g-2">
    <div class="card"><div class="card-h"><h3>ข้อมูลร้าน</h3></div><div class="card-b">
      <div class="fld-row f-2">
        <div><label class="fld">ชื่อร้าน</label><input id="stShop" class="inp" value="${esc(S.settings.shopName)}"></div>
        <div><label class="fld">เวลาเช็คสต๊อกประจำวัน</label><input id="stTime" type="time" class="inp" value="${S.settings.checkTime}"></div>
      </div>
      <button class="btn btn-red" onclick="saveSettings()">✓ บันทึกการตั้งค่า</button>
    </div></div>

    <div class="card"><div class="card-h"><h3>สาขา</h3><span class="sub">ข้อมูลสต๊อก/เช็ค/ออเดอร์/บิล แยกเก็บต่อสาขา</span></div><div class="card-b">
      ${S.branches.map(b=>`<div style="display:flex; gap:8px; align-items:center; margin-bottom:8px">
        <input class="inp" style="flex:1" id="brName_${b.id}" value="${esc(b.name)}">
        <span class="t-sub" style="white-space:nowrap">${S.bd[b.id].products.length} สินค้า</span>
        <button class="btn btn-ghost btn-sm" onclick="renameBranch('${b.id}')">บันทึกชื่อ</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--bad)" onclick="removeBranch('${b.id}')">ลบ</button>
      </div>`).join('')}
      <div style="border-top:1px dashed var(--line); margin:12px 0; padding-top:12px">
        <label class="fld">+ เพิ่มสาขาใหม่</label>
        <div style="display:flex; gap:8px; flex-wrap:wrap">
          <input class="inp" style="flex:1; min-width:150px" id="newBrName" placeholder="ชื่อสาขา เช่น สาขาบางกะปิ">
          <select class="inp" style="width:auto" id="newBrCopy">
            <option value="">เริ่มจากรายการสินค้าว่าง</option>
            ${S.branches.map(b=>`<option value="${b.id}">คัดลอกสินค้าจาก ${esc(b.name)}</option>`).join('')}
          </select>
          <button class="btn btn-red" onclick="createBranch()">+ เพิ่ม</button>
        </div>
        <div class="t-sub" style="margin-top:6px">คัดลอกเฉพาะรายการสินค้า+เกณฑ์สั่ง (Safety/Max/เรต) — ประวัติเช็ค ออเดอร์ บิล เริ่มใหม่ของใครของมัน</div>
      </div>
    </div></div>

    <div class="card"><div class="card-h"><h3>ข้อมูล & สำรองไฟล์</h3><span class="sub">โครงพร้อมย้ายขึ้น NAS</span></div><div class="card-b">
      <p style="font-size:13px; color:var(--sub); margin-bottom:12px">
        ตอนนี้ข้อมูลเก็บในเครื่อง (localStorage) เพื่อทดลองระบบ · เวอร์ชันใช้งานจริงจะสลับ storage adapter
        ให้อ่าน-เขียนผ่าน API บน NAS โดยใช้โครงข้อมูล JSON ชุดเดียวกันนี้ (แยก key ต่อสาขาได้ทันที)</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="exportJSON()">⬇️ Export JSON (ทุกสาขา)</button>
        <label class="btn btn-ghost" style="cursor:pointer">⬆️ Import JSON<input type="file" accept=".json" style="display:none" onchange="importJSON(this)"></label>
        <button class="btn btn-ghost" style="color:var(--bad)" onclick="resetSeed()">♻️ รีเซ็ตเป็นข้อมูลตั้งต้นจาก Excel</button>
      </div>
      <div style="margin-top:14px; font-size:12.5px; color:var(--sub)">
        ${esc(branchName())}: เช็คสต๊อก ${Object.keys(B().checks).length} วัน · ออเดอร์ ${B().orders.length} · บิล ${B().bills.length} ใบ · สินค้า ${B().products.length} · ซัพทั้งหมด ${S.suppliers.length}</div>
    </div></div>
  </div>`;
}
function saveSettings(){
  S.settings.shopName = $('#stShop').value.trim()||'จริงใจหมูกระทะ';
  S.settings.checkTime = $('#stTime').value||'21:00';
  DB.save(); refreshTop(); toast('บันทึกการตั้งค่าแล้ว');
}
function renameBranch(id){
  const v = $('#brName_'+id).value.trim();
  if(!v) return toast('ใส่ชื่อสาขาก่อน');
  S.branches.find(b=>b.id===id).name = v;
  DB.save(); refreshTop(); renderSettings(); toast('เปลี่ยนชื่อสาขาแล้ว');
}
function removeBranch(id){
  if(S.branches.length<=1) return toast('ต้องมีอย่างน้อย 1 สาขา');
  const b = S.branches.find(x=>x.id===id);
  confirmBox(`ลบ <b>${esc(b.name)}</b>? ข้อมูลสินค้า เช็คสต๊อก ออเดอร์ และบิลของสาขานี้จะถูกลบถาวร`, ()=>{
    S.branches = S.branches.filter(x=>x.id!==id);
    delete S.bd[id];
    if(S.activeBranch===id) S.activeBranch = S.branches[0].id;
    DB.save(); refreshTop(); renderSettings(); toast('ลบสาขาแล้ว');
  });
}
function createBranch(){
  const name = $('#newBrName').value.trim();
  if(!name) return toast('ใส่ชื่อสาขาก่อน');
  const id = addBranch(name, $('#newBrCopy').value||null);
  switchBranch(id);
  showPage('settings');
  toast('เพิ่ม'+name+'แล้ว — สลับมาที่สาขานี้ให้เลย');
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(S,null,1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `jjmk-stock-${todayISO()}.json`; a.click(); URL.revokeObjectURL(a.href);
  toast('ดาวน์โหลดไฟล์สำรองแล้ว');
}
function importJSON(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try{
    const d = JSON.parse(r.result);
    if(!d.bd || !d.suppliers || !d.branches) throw new Error('bad');
    S = d;
    if(!S.bd[S.activeBranch]) S.activeBranch = S.branches[0].id;
    DB.save(); refreshTop(); showPage('dash'); toast('นำเข้าข้อมูลเรียบร้อย');
  }catch(e){ toast('ไฟล์ไม่ถูกต้อง'); } };
  r.readAsText(f);
  inp.value = '';
}
function resetSeed(){
  confirmBox('ล้างข้อมูลทั้งหมด (ทุกสาขา) แล้วโหลดข้อมูลตั้งต้นจากไฟล์ Excel ใหม่?', ()=>{ seedReal(); refreshTop(); showPage('dash'); toast('รีเซ็ตข้อมูลแล้ว'); });
}

/* =====================  INIT  ===================== */
const RENDER = {dash:renderDash, check:renderCheck, order:renderOrder, receive:renderReceive, bills:renderBills, history:renderHistory, products:renderProducts, suppliers:renderSuppliers, settings:renderSettings};
$('#nav').addEventListener('click', e=>{ const b=e.target.closest('button[data-page]'); if(b) showPage(b.dataset.page); });
$('#hamburger').onclick = ()=> $('#sidebar').classList.toggle('open');
$('#modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
$('#branchSel').addEventListener('change', e=>switchBranch(e.target.value));

S = DB.load();
if(!S || !S.version || S.version < 2) seedReal();
if(S.version === 2){ S.version = 3; DB.save(); }
if(!S.lineGroups){ S.lineGroups = DEFAULT_LINE_GROUPS.map(g=>({...g})); DB.save(); }
if(!S.billAlias){ S.billAlias = {}; DB.save(); }
refreshLineGroups(true);   /* ดึงกลุ่มไลน์จริงเข้ามาแทนรายชื่อจำลองทันทีที่เน็ตถึง */
if(!S.bd[S.activeBranch]) S.activeBranch = S.branches[0].id;
refreshTop();
showPage('dash');
setInterval(refreshTop, 60000);
</script>
</body>
